<html>
<head>
    <title>Hello Kitty & Bow Cursor</title>
    <style>
        body {
            background-color: #FFC0CB;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            cursor: none; /* Hide default cursor */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Hello Kitty GIF */
        #hello-kitty-gif {
            width: 280px;
            height: auto;
            margin-bottom: 50px;
            pointer-events: none; 
            z-index: 1;
        }

        .button-wrapper {
            display: flex;
            gap: 200px; /* Nice wide gap */
            align-items: center;
            z-index: 10;
        }

        button {
            padding: 15px 40px;
            font-size: 20px;
            border: none;
            border-radius: 30px;
            background-color: #FF6F77;
            color: white;
            cursor: none;
            transition: 0.1s ease;
        }

        #byeBtn {
            position: relative; 
            z-index: 20;
        }

        /* Bow Cursor */
        #bow-cursor {
            position: fixed;
            width: 50px;
            height: auto;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            left: 0;
            top: 0;
        }
    </style>
</head>
<body>

    <img id="hello-kitty-gif" src="Hello Kitty Gif.gif" alt="Hello Kitty">

    <div class="button-wrapper">
        <button id="hiBtn" onclick="sayHi()">Hi</button>
        <button id="byeBtn" onmouseover="moveButton()">Bye</button>
    </div>

    <img id="bow-cursor" src="bow.png" alt="Bow">

    <script>
        const bowCursor = document.getElementById('bow-cursor');
        const byeBtn = document.getElementById('byeBtn');
        const kittyGif = document.getElementById('hello-kitty-gif');

        // 1. Smooth Cursor Movement
        document.addEventListener('mousemove', (e) => {
            bowCursor.style.left = e.clientX + 'px';
            bowCursor.style.top = e.clientY + 'px';
        });

         {
            const currentSrc = kittyGif.src.split('?')[0];
            // Adding a timestamp prevents the browser from using a "frozen" cached version
            kittyGif.src = currentSrc + "?t=" + new Date().getTime();
        }

        function sayHi() {
            alert("Hi there! 🎀");
            keepDancing(); // Restart animation after alert closes
        }

        function moveButton() {
            byeBtn.style.position = "fixed";

            const padding = 80;
            const maxX = window.innerWidth - byeBtn.offsetWidth - padding;
            const maxY = window.innerHeight - byeBtn.offsetHeight - padding;

            const randomX = Math.floor(Math.random() * maxX) + (padding / 2);
            const randomY = Math.floor(Math.random() * maxY) + (padding / 2);

            byeBtn.style.left = randomX + 'px';
            byeBtn.style.top = randomY + 'px';
            
            // Occasionally refresh GIF while the button is jumping to ensure it stays live
            if(Math.random() > 0.8) {
                keepDancing();
            }
        }

        // Run the fix once on load to be safe
        window.onload = keepDancing;
    </script>

</body>
</html>
